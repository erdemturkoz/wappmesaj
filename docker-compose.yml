services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: wappmesaj
      POSTGRES_USER: wappmesaj
      POSTGRES_PASSWORD: wappmesaj
    ports:
      - '5432:5432'
    volumes:
      - wappmesaj_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U wappmesaj -d wappmesaj']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  wappmesaj_postgres:
